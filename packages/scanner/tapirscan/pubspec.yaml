name: scanner_tapirscan
description: Scanner implementation using Tapirscan
version: 1.0.0
publish_to: "none"
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  visibility_detector: ^0.4.0+2
  scanner_shared:
    path: ../shared
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  openfoodfacts_flutter_lints:
    git: https://github.com/openfoodfacts/openfoodfacts_flutter_lints.git
flutter:
  plugin:
    platforms:
      android:
        package: org.openfoodfacts.scanner.tapirscan
        pluginClass: TapirscanPlugin
