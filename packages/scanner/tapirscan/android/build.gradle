group 'org.openfoodfacts.scanner.tapirscan'
version '1.0.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:9.0.0' }
}
apply plugin: 'com.android.library'

android {
    namespace 'org.openfoodfacts.scanner.tapirscan'
    compileSdk 36
    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def tapirscanJar = file('libs/tapirscan-1.4.0.jar')
if (!tapirscanJar.exists()) {
    throw new GradleException('Build Tapirscan 1.4.0 first: see packages/scanner/tapirscan/README.md')
}
dependencies { implementation files(tapirscanJar) }
